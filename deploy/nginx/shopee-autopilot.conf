# =============================================================================
# Shopee Affiliate Autopilot — HTTPS reverse proxy (Part 9 §9)
#
# TLS terminates HERE; the Node process listens on 127.0.0.1:8080 only, so the
# application port is never reachable from the network. Placeholders only —
# adapt server_name, certificate paths and upstream port to the deployment.
#
# Install: adapt, then reference from nginx.conf (e.g. from
# /etc/nginx/conf.d/shopee-autopilot.conf) and reload nginx.
# =============================================================================

# --- HTTP -> HTTPS redirect --------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name autopilot.example.com;

    # ACME renewal only (example; adjust to the certbot/webroot layout):
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS API ---------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1; on older nginx use `listen 443 ssl http2;` instead.
    http2 on;
    server_name autopilot.example.com;

    ssl_certificate     /etc/letsencrypt/live/autopilot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autopilot.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Must match the Fastify bodyLimit (25 MiB) — the proxy rejects oversized
    # bodies before they reach the application.
    client_max_body_size 25m;

    # Must stay >= the app's requestTimeout (600 s) so long generation requests
    # are not cut mid-flight by the proxy.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Liveness and readiness probes (public, deliberately minimal bodies).
    # /health = process liveness; /ready = DB + schema + draining state.
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }
    location = /ready {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Do not advertise the proxy; the app already refuses methods/paths it
    # does not know (404/405) with no directory listing surface.
    server_tokens off;
}
